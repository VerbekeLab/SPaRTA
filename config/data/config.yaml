parameters:
  dataset: 'AMLSim'
  time_dynamic: True

AMLWorld:
  type_dataset: 'HI-Small'
  n_channels: 10 # channels after aggregation
  network_construction:
    echo: True
    days_echo: 3
    time_step: 1
    time_width: 1
    time_type: 'days'

AMLSim:
  type_dataset: 'AMLSim'
  n_channels: 10 # channels after aggregation
  network_construction:
    echo: True
    days_echo: 3
    time_step: 1
    time_width: 1
    time_type: 'days'

Tide:
  type_dataset: 'HI' # 'HI' (higher illicit ratio) or 'LI' (lower illicit ratio) -> reads data/Tide/generated_edges_<type>.csv
  n_channels: 10 # channels after aggregation
  network_construction:
    echo: True
    days_echo: 3
    time_step: 1
    time_width: 1
    time_type: 'days'